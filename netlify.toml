# Netlify deployment settings.
# There is no build step: the site is plain HTML, so Netlify just publishes
# these files exactly as they are.

[build]
  publish = "."

# Clean URLs for the guide sections. /routes/apprenticeships serves
# guide.html while keeping the nice address in the browser bar.
[[redirects]]
  from = "/routes/*"
  to = "/guide.html"
  status = 200

[[redirects]]
  from = "/funding/*"
  to = "/guide.html"
  status = 200

[[redirects]]
  from = "/careers/*"
  to = "/guide.html"
  status = 200

# Old pathway URLs, kept working.
[[redirects]]
  from = "/pathways/*"
  to = "/careers/:splat"
  status = 301

[[redirects]]
  from = "/pathways.html"
  to = "/guides.html"
  status = 301

# Keep working notes and the database script out of the public site.
[[redirects]]
  from = "/docs/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/supabase/*"
  to = "/index.html"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# Never let the CMS page be indexed by search engines.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"
