# ===========================================================================
# Decap CMS — the thing that lets you edit the website's words yourself.
#
# ONE LINE BELOW NEEDS CHANGING before this works: `repo`.
# Replace YOUR-GITHUB-USERNAME with your actual GitHub username once you
# have created the repository.
# ===========================================================================

backend:
  name: github
  repo: Chrnsey/socialcapital
  branch: main
  # Sign in through our own /oauth/ function on Cloudflare, rather than
  # Netlify's service. The function lives in functions/oauth/.
  base_url: https://socialcapital.ie
  auth_endpoint: oauth/auth

# Saves go straight to the live site. If you would rather have a "draft"
# step where changes wait for you to publish them, delete the # on the
# next line.
# publish_mode: editorial_workflow

media_folder: "images"
public_folder: "/images"

collections:
  - name: pages
    label: "Page wording"
    files:

      # ---------------------------------------------------------------
      - name: index
        label: "Homepage"
        file: "content/index.json"
        format: json
        fields:
          - name: hero
            label: "Opening section"
            widget: object
            fields:
              - { name: title, label: "Big headline", widget: string }
              - { name: body, label: "Paragraph underneath", widget: text }
              - { name: cta_primary, label: "Green button text", widget: string }
          - name: values
            label: "The three short points under the headline"
            widget: object
            fields:
              - name: items
                label: "Points"
                label_singular: "point"
                widget: list
                summary: "{{fields.title}}"
                fields:
                  - { name: title, label: "Heading", widget: string }
                  - { name: body, label: "Text", widget: text }
          - name: teasers
            label: "The three cards"
            widget: object
            fields:
              - { name: tag, label: "Small grey label above", widget: string }
              - { name: title, label: "Section heading", widget: string }
              - { name: body, label: "Section intro paragraph", widget: text }
              - { name: note, label: "Small note under the cards", widget: string }
              - name: items
                label: "Cards"
                label_singular: "card"
                widget: list
                summary: "{{fields.name}}"
                fields:
                  - { name: marker, label: "Text in the circle (keep it to 1-2 characters)", widget: string }
                  - { name: name, label: "Card heading", widget: string }
                  - { name: role, label: "Small grey line under the heading", widget: string }
                  - { name: quote, label: "Quote", widget: text }
          - name: industries
            label: "Industries section"
            widget: object
            fields:
              - { name: tag, label: "Small grey label above", widget: string }
              - { name: title, label: "Heading", widget: string }
              - { name: body, label: "Paragraph (the <strong> tags make text bold - leave them in place)", widget: text }
          - name: cta
            label: "Green box at the bottom"
            widget: object
            fields:
              - { name: title, label: "Heading", widget: string }
              - { name: body, label: "Paragraph", widget: text }

      # ---------------------------------------------------------------
      - name: schools
        label: "For schools page"
        file: "content/schools.json"
        format: json
        fields:
          - name: hero
            label: "Opening section"
            widget: object
            fields:
              - { name: title, label: "Big headline", widget: string }
              - { name: body, label: "Paragraph underneath", widget: text }
          - name: how
            label: "How it works section"
            widget: object
            fields:
              - { name: title, label: "Heading", widget: string }
          - name: cta
            label: "Green box at the bottom"
            widget: object
            fields:
              - { name: title, label: "Heading", widget: string }

      # ---------------------------------------------------------------
      - name: mentors
        label: "Become a mentor page"
        file: "content/mentors.json"
        format: json
        fields:
          - name: hero
            label: "Opening section"
            widget: object
            fields:
              - { name: title, label: "Big headline", widget: string }
              - { name: body, label: "Paragraph underneath", widget: text }
          - name: quote
            label: "Your statement"
            widget: object
            fields:
              - { name: tag, label: "Small grey label above", widget: string }
              - { name: body, label: "Why you started Social Capital (this one should sound like you, not an organisation)", widget: text }
              - { name: attribution, label: "Signed off as", widget: string }
          - name: signup
            label: "Sign-up section"
            widget: object
            fields:
              - { name: title, label: "Heading", widget: string }
              - { name: body, label: "Paragraph", widget: text }

      # ---------------------------------------------------------------
      - name: businesses
        label: "For businesses page"
        file: "content/businesses.json"
        format: json
        fields:
          - name: hero
            label: "Opening section"
            widget: object
            fields:
              - { name: title, label: "Big headline", widget: string }
              - { name: body, label: "Paragraph underneath", widget: text }
          - name: ways
            label: "Ways to get involved section"
            widget: object
            fields:
              - { name: title, label: "Heading", widget: string }
          - name: cta
            label: "Box at the bottom"
            widget: object
            fields:
              - { name: title, label: "Heading", widget: string }
              - { name: body, label: "Paragraph", widget: text }

  # -------------------------------------------------------------------
  - name: sectors
    label: "Industry descriptions"
    files:
      - name: sectors
        label: "Industry descriptions (shown in the directory)"
        file: "content/sectors.json"
        format: json
        fields:
          - name: sectors
            label: "Industries"
            label_singular: "industry"
            widget: list
            summary: "{{fields.title}}"
            fields:
              - name: slug
                label: "Internal code — MUST match the industry saved on mentors, so pick from the list"
                widget: select
                options:
                  - technology
                  - healthcare
                  - law
                  - finance
                  - trades
                  - media
                  - education
                  - engineering
                  - public_sector
                  - other
              - { name: title, label: "Name shown on screen", widget: string }
              - { name: summary, label: "Description of the sector", widget: text }

  # -------------------------------------------------------------------
  - name: routes
    label: "Ways in"
    files:
      - name: routes
        label: "Ways in"
        file: "content/routes.json"
        format: json
        fields:
          - name: section
            label: "Top of this section's page"
            widget: object
            fields:
              - { name: slug, label: "Internal code - do not change", widget: string }
              - { name: tag, label: "Small grey label", widget: string }
              - { name: title, label: "Section heading", widget: string }
              - { name: intro, label: "Section intro paragraph", widget: text }
          - name: items
            label: "Ways in"
            label_singular: "way in"
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { name: slug, label: "Web address (lowercase, hyphens - changing this breaks links)", widget: string }
              - { name: title, label: "Title", widget: string }
              - { name: subtitle, label: "Small line above the title", widget: string, required: false }
              - { name: summary, label: "One-line summary (shown on the card)", widget: string }
              - { name: checked, label: "Information last checked (e.g. September 2026)", widget: string }
              - { name: body, label: "Main explanation (blank line = new paragraph)", widget: text }
              - name: facts
                label: "Quick facts box (optional)"
                label_singular: "fact"
                widget: list
                required: false
                summary: "{{fields.label}}"
                fields:
                  - { name: label, label: "Label", widget: string }
                  - { name: value, label: "Value", widget: string }
              - name: blocks
                label: "Sections"
                label_singular: "section"
                widget: list
                required: false
                summary: "{{fields.heading}}"
                fields:
                  - { name: heading, label: "Heading", widget: string }
                  - { name: text, label: "Text", widget: text }
              - name: myths
                label: "What people get wrong (optional)"
                label_singular: "myth"
                widget: list
                required: false
                summary: "{{fields.myth}}"
                fields:
                  - { name: myth, label: "The myth", widget: string }
                  - { name: reality, label: "The reality", widget: text }
              - name: apply
                label: "Official links"
                label_singular: "link"
                widget: list
                required: false
                summary: "{{fields.label}}"
                fields:
                  - { name: label, label: "Link text", widget: string }
                  - { name: url, label: "Address", widget: string }
              - name: related
                label: "Read next (links to other pages on this site)"
                label_singular: "link"
                widget: list
                required: false
                summary: "{{fields.label}}"
                fields:
                  - { name: label, label: "Link text", widget: string }
                  - { name: href, label: "Address, e.g. /funding/hear", widget: string }

